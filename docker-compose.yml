services:
  lightwire:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./workspace:/app/workspace:ro
      - lightwire_data:/app/data
    environment:
      WORKSPACE_PATH: /app/workspace
      SQLITE_PATH: /app/data/lightwire.db

volumes:
  lightwire_data:
